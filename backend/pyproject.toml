[project]
name = "whymoved"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "httpx",
    "pyarrow",
    "defusedxml",
    "tzdata",  # New York market hours on systems without a time-zone database
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pandas-stubs", "types-defusedxml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N818"]  # exception names like EdgarNotFound read better without an Error suffix

[tool.mypy]
mypy_path = "tests"
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=whymoved --cov-report=term-missing"
