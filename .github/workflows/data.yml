name: Nightly data

on:
  schedule:
    - cron: "0 4 * * 2-6"   # 04:00 UTC Tuesday to Saturday: after Monday to Friday sessions close
  workflow_dispatch:
    inputs:
      force_full:
        description: "Refetch all price history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: backend
    env:
      WHYMOVED_ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      WHYMOVED_ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      WHYMOVED_SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      WHYMOVED_FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # Consolidated (SIP) daily history: the free plan serves it for past days, and the IEX
      # feed has no data before mid-2020 and gaps in thinly traded stocks.
      WHYMOVED_ALPACA_FEED: sip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install
        run: pip install -c requirements.lock .

      - name: Restore the previous snapshot
        run: |
          mkdir -p data
          gh release download data-latest --dir data --clobber || echo "No previous snapshot yet"

      - name: Prices and universe
        id: prices
        run: python -m whymoved.jobs.nightly ${{ inputs.force_full && '--force-full' || '' }}

      - name: Headlines
        id: news
        continue-on-error: true
        run: python -m whymoved.jobs.collect_news

      - name: Insider data sets
        id: insider
        continue-on-error: true
        run: python -m whymoved.jobs.collect_insider

      - name: Recent filings
        id: filings
        continue-on-error: true
        run: python -m whymoved.jobs.collect_filings

      - name: Press releases
        id: press
        if: steps.filings.outcome == 'success'
        continue-on-error: true
        # Capped per run: the two-year history fills in over a few nights, newest first.
        run: python -m whymoved.jobs.collect_press --max-filings 10000 --max-minutes 60

      - name: Economic calendar
        id: macro
        continue-on-error: true
        run: python -m whymoved.jobs.collect_macro

      - name: World press
        id: world
        continue-on-error: true
        # Reads GDELT's 15-minute files since the last run; the first run fills in 30 days.
        run: python -m whymoved.jobs.collect_world_news --backfill-days 30 --max-minutes 45

      - name: FDA and clinical trials
        id: health
        continue-on-error: true
        run: python -m whymoved.jobs.collect_health

      - name: Pooled insider study
        id: study
        if: steps.insider.outcome == 'success' || steps.filings.outcome == 'success'
        continue-on-error: true
        run: python -m whymoved.jobs.insider_study

      - name: Publish the snapshot
        run: |
          gh release view data-latest > /dev/null 2>&1 || \
            gh release create data-latest --title "Data snapshot" \
              --notes "Nightly data snapshot, replaced on every run."
          gh release upload data-latest data/* --clobber

      - name: Fail the run if a collector failed
        if: steps.news.outcome == 'failure' || steps.insider.outcome == 'failure' || steps.filings.outcome == 'failure' || steps.press.outcome == 'failure' || steps.macro.outcome == 'failure' || steps.world.outcome == 'failure' || steps.health.outcome == 'failure' || steps.study.outcome == 'failure'
        run: |
          echo "A collector failed. The snapshot was still published with the data that succeeded."
          exit 1
